services:
  - type: web
    name: andredrive
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/lib/andredrive
      - key: TRUST_PROXY
        value: "1"
      - key: PUBLIC_BASE_URL
        sync: false
    disk:
      name: andredrive-data
      mountPath: /var/lib/andredrive
      sizeGB: 10
